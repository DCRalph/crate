<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crate on CarPlay: mockups</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Big+Shoulders+Display:wght@700;800&display=swap">
<style>
/* Mockups of Crate on a car's screen, each drawn at 960 by 540. The pictures in design-previews/carplay are photographs of these. The albums and artists are made up. */
/* Stand-in artwork, drawn in CSS, as in the style guide. */
.cv{display:block;aspect-ratio:1;flex:none;background-color:#222;background-size:cover}
.cv1{background-image:radial-gradient(circle at 32% 68%,#f6c453 0 9%,rgba(246,196,83,.35) 9.5% 17%,transparent 17.5%),linear-gradient(#0b1d33 0 62%,#12355b 62% 64%,#0e2a47 64%)}
.cv2{background-image:radial-gradient(circle at 70% 55%,#e4572e 0 15%,transparent 15.5%),linear-gradient(#ecdfc8 0 55%,#2f6f8f 55% 78%,#255a75 78%)}
.cv4{background-image:linear-gradient(135deg,#ff9f1c 0 33%,#fff 33% 36%,#2ec4b6 36% 66%,#fff 66% 69%,#e71d36 69%)}
.cv5{background-image:radial-gradient(circle at 50% 118%,#0a1128 0 58%,transparent 58.5%),linear-gradient(#17255a,#3a5ba0 55%,#e8a87c)}
.cv6{background-image:radial-gradient(circle at 75% 30%,#f4f1de 0 10%,transparent 10.5%),linear-gradient(90deg,#3d5a40 0 50%,#a3b18a 50%)}
.cv7{background-image:radial-gradient(circle at 50% 50%,#111 0 20%,#f2e9e4 20.5% 22%,#111 22.5% 42%,#c9ada7 42.5% 44%,#22223b 44.5%)}

/* One car screen: the car's own dock at the left, the app beside it. Night unless .day. */
.car{--cab:#0e2b2f;--cab-2:#12363b;--cab-3:#1a4449;--cab-line:#2b565b;--glass:#071a1d;--chrome:#e3ebe8;--chrome-2:#93adab;
  --strip:#f3ead4;--strip-2:#e7dbbd;--strip-line:#cdbf9b;--ink:#1b1a16;--ink-2:#5b5545;--band:#ef5b34;--lamp:#ffc44d;
  width:960px;height:540px;display:flex;overflow:hidden;position:relative;background:#000;
  font:500 16px/1.25 Jost,system-ui,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.car.day{--cab:#bcdcd5;--cab-2:#a9d0c8;--cab-3:#97c4bb;--cab-line:#7fb0a7;--chrome:#0e2b2f;--chrome-2:#35595d;--strip:#fbf6e7;--strip-2:#f0e6cc;--strip-line:#d6c9a6}
.car *{box-sizing:border-box;margin:0}
.car svg.i{flex:none;display:block}
.num{font-family:"Big Shoulders Display",Jost,sans-serif;font-weight:700;letter-spacing:.03em}
.sp{flex:1}

.dock{width:76px;flex:none;background:#06090a;color:#fff;display:flex;flex-direction:column;align-items:center;padding:18px 0 16px;font-family:-apple-system,system-ui,sans-serif}
.dock time{font-size:18px;font-weight:600;letter-spacing:-.2px}
.dock .net{display:flex;align-items:flex-end;gap:5px;margin-top:6px;font-size:11px;font-weight:700;line-height:1}
.dock .bars{display:flex;align-items:flex-end;gap:2px}
.dock .bars i{width:3px;border-radius:1px;background:#fff}
.dock .bars i:nth-child(1){height:4px}.dock .bars i:nth-child(2){height:6px}.dock .bars i:nth-child(3){height:8px}.dock .bars i:nth-child(4){height:10px;opacity:.35}
.dock .apps{display:flex;flex-direction:column;gap:13px;margin-top:auto}
.dock .ic{width:50px;height:50px;border-radius:13px;display:grid;place-items:center;color:#fff}
.dock .nav{background:linear-gradient(#5aa9ff,#2b6fe0)}
.dock .tel{background:linear-gradient(#63d977,#2fb24b)}
.dock .crate{background:#0e2b2f;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.dock .crate i{width:36px;height:17px;border-radius:3px 3px 0 0;background:linear-gradient(#f3ead4 0 68%,#ef5b34 68%);position:relative}
.dock .crate i::after{content:"";position:absolute;right:4px;top:3px;width:5px;height:5px;border-radius:50%;background:#ffc44d;box-shadow:0 0 0 1px #1b1a16}
.dock .home{margin-top:auto;opacity:.9}

.app{flex:1;min-width:0;position:relative;overflow:hidden;background:var(--cab);color:var(--chrome);display:flex;flex-direction:column}
.app.pad{padding:22px 26px}
.app.np{--cab:#0e2b2f;--cab-line:#2b565b;--chrome:#e3ebe8;--chrome-2:#93adab;justify-content:space-between}

/* Glass, for what floats: follows the cabinet, or is night at any hour. */
.glass{background:rgba(255,255,255,.07);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),inset 0 0 0 1px rgba(255,255,255,.09),0 10px 26px -12px rgba(0,0,0,.6);backdrop-filter:blur(18px);color:var(--chrome)}
.day .glass{background:rgba(255,255,255,.42);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),inset 0 0 0 1px rgba(14,43,47,.1),0 10px 24px -14px rgba(14,43,47,.5)}
.glass.night,.day .glass.night{background:rgba(7,26,29,.8);box-shadow:inset 0 1px 0 rgba(255,255,255,.16),inset 0 0 0 1px rgba(255,255,255,.07),0 12px 28px -12px rgba(0,0,0,.65);color:#e3ebe8}

.bar{display:flex;align-items:center;gap:14px;height:56px;flex:none}
.bar h1{font:800 36px/1 "Big Shoulders Display",sans-serif;text-transform:uppercase;letter-spacing:.015em;white-space:nowrap}
.from{color:var(--chrome-2);font-size:16px;white-space:nowrap;padding-top:6px}
.from b{color:var(--chrome);font-weight:600}
.rnd{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;flex:none}
.lbl{font:600 13px/1 Jost,sans-serif;text-transform:uppercase;letter-spacing:.09em;color:var(--chrome-2)}
.mark{display:flex;align-items:center;gap:8px;background:var(--strip);color:var(--ink);border-radius:4px;padding:0 10px;height:34px}
.mark b{font:800 22px/1 "Big Shoulders Display",sans-serif;text-transform:uppercase;letter-spacing:.08em;padding-top:1px}

.lampd{display:inline-block;width:11px;height:11px;border-radius:50%;border:1.5px solid currentColor;flex:none;opacity:.5}
.lampd.on{background:var(--lamp);border-color:var(--lamp);opacity:1}
.card .lampd.on,.mark .lampd.on{border-color:var(--ink)}
.plate{display:inline-grid;place-items:center;flex:none;background:var(--glass);color:var(--lamp);font:700 20px/1 "Big Shoulders Display",sans-serif;letter-spacing:.05em;min-width:42px;height:30px;padding:1px 7px 0;border-radius:4px}
.chip{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 11px;border-radius:5px;box-shadow:inset 0 0 0 1.5px var(--cab-line);color:var(--chrome);font:600 12.5px/1 Jost,sans-serif;text-transform:uppercase;letter-spacing:.07em;white-space:nowrap}
.chip.warn{background:var(--lamp);color:var(--ink);box-shadow:none;height:40px;padding:0 14px;font-size:13.5px}

/* A title strip: the name on ivory, the facts on the band. */
.strip{display:block;background:var(--strip);color:var(--ink);border-radius:4px;overflow:hidden;min-width:0}
.strip b,.strip span{display:block;padding:0 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip b{font-weight:600;font-size:16px;text-transform:uppercase;letter-spacing:.05em;line-height:38px}
.strip span{background:var(--band);font-size:14.5px;font-weight:500;line-height:30px}
.strip.xl b{font-size:28px;line-height:64px;padding:0 18px;letter-spacing:.04em}
.strip.xl span{font-size:20px;line-height:44px;padding:0 18px}
.strip.inbar{flex:1}
.strip.inbar b{font-size:20px;line-height:36px}
.strip.inbar span{font-size:15.5px;line-height:28px}

/* Keys, sized for an arm's reach. */
.key{display:inline-flex;align-items:center;justify-content:center;gap:10px;flex:none;height:60px;min-width:104px;padding:0 22px 5px;border-radius:9px;background:var(--strip);color:var(--ink);font:600 15px/1 Jost,sans-serif;text-transform:uppercase;letter-spacing:.07em;white-space:nowrap;box-shadow:inset 0 -5px 0 rgba(0,0,0,.2)}
.key.pri{background:var(--band)}
.key.wide{min-width:156px;height:66px}
.key.quiet{background:transparent;color:var(--chrome);box-shadow:inset 0 0 0 1.5px var(--cab-line);padding-bottom:0;min-width:76px}
.key.quiet.lit{color:var(--lamp);box-shadow:inset 0 0 0 1.5px var(--lamp)}
.key.small{height:48px;min-width:0;padding:0 16px;font-size:13.5px}
.keys{display:flex;align-items:center;justify-content:center;gap:14px;flex:none}

/* The waveform. */
.wv{display:block;flex:none}
.wv .p{fill:var(--lamp)}
.wv .u{fill:#93adab;opacity:.42}
.wv .h{fill:#f3ead4}
.scrub{display:flex;align-items:center;justify-content:space-between;flex:none;font-size:26px;color:var(--chrome-2)}
.scrub .num{width:52px}
.scrub .num.now,.num.now{color:var(--lamp)}
.scrub .num:first-child{text-align:right}

/* Now playing A */
.mid{display:flex;align-items:center;gap:24px;flex:none}
.art{border-radius:5px;box-shadow:0 14px 30px -14px rgba(0,0,0,.7)}
.meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:16px}
.facts{display:flex;align-items:center;gap:12px;font-size:17px;color:var(--chrome)}
.next{display:flex;align-items:baseline;gap:10px;font-size:16px;color:var(--chrome-2);white-space:nowrap}
.next b{color:var(--chrome);font-weight:600}

/* Now playing B */
.np.wide .bar{height:64px}
.hero{position:relative;padding-top:38px;flex:none}
.hero .at{position:absolute;top:0;min-width:58px;height:32px;font-size:22px}
.under{display:flex;align-items:center;justify-content:space-between;flex:none;color:var(--chrome-2)}
.num.big{font-size:46px;line-height:1;width:110px}
.under .num.big:last-child{text-align:right}

/* Now playing C */
.np.cover{flex-direction:row;align-items:center}
.wash{position:absolute;inset:-60px;filter:blur(46px);aspect-ratio:auto}
.tint{position:absolute;inset:0;background:rgba(14,43,47,.62)}
.np.cover .back{position:absolute;top:22px;left:26px;z-index:1}
.np.cover .left{position:relative;width:410px;flex:none;display:grid;place-items:center}
.np.cover .left .art{width:318px;margin-left:34px}
.np.cover .right{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;gap:18px;padding-right:30px}
.panel{border-radius:28px;padding:20px 22px 22px;display:flex;flex-direction:column;gap:18px}
.panel .scrub{font-size:22px}
.panel .scrub .num{width:44px}
.rounds{display:flex;align-items:center;justify-content:space-between}
.round{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:rgba(227,235,232,.1);color:#e3ebe8}
.round.pri{width:86px;height:86px;background:var(--band);color:var(--ink)}
.mode{width:48px;height:48px;display:grid;place-items:center;color:#93adab}
.mode.on{color:var(--lamp)}
.np.cover .next{align-items:center}

/* Pages with the tabs and the deck */
.app.browse{padding-bottom:104px;gap:22px}
.tabs{display:flex;gap:2px;height:56px;padding:5px;border-radius:28px;flex:none}
.tabs a{display:flex;align-items:center;gap:9px;padding:0 19px;border-radius:23px;color:var(--chrome-2);font:600 14px/1 Jost,sans-serif;text-transform:uppercase;letter-spacing:.07em}
.tabs a.cur{background:var(--strip);color:var(--ink);padding:0 22px 0 18px}
.deck{position:absolute;left:26px;right:26px;bottom:18px;height:68px;border-radius:34px;display:flex;align-items:center;gap:16px;padding:0 10px 0 9px}
.deck .label{width:50px;border-radius:50%;position:relative}
.deck .label::after{content:"";position:absolute;inset:21px;border-radius:50%;background:#071a1d}
.deck .t{flex:1;min-width:0}
.deck .t b,.deck .t span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.deck .t b{font-weight:600;font-size:15px;text-transform:uppercase;letter-spacing:.07em}
.deck .t span{font-size:14.5px;color:#93adab}
.deck .time{font-size:22px;color:var(--lamp);width:40px}
.deck .play{width:50px;height:50px;border-radius:50%;background:var(--band);color:var(--ink);display:grid;place-items:center;flex:none}
.deck .skip{width:50px;height:50px;display:grid;place-items:center;flex:none}
.cols{display:flex;gap:28px;flex:1;min-height:0}
section{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:var(--strip);color:var(--ink);border-radius:8px}
.nm{flex:1;min-width:0}
.nm b,.nm span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Home */
.carry{width:300px;flex:none}
.carry .card{display:flex;flex-direction:column;gap:12px;padding:12px}
.carry .card .cv{border-radius:3px}
.carry .nm b{font-size:19px;font-weight:600}
.carry .nm span{font-size:15px}
.carry .nm .dim{color:var(--ink-2);font-size:14px}
.carry .card{flex-direction:row;align-items:center}
.pair{display:flex;gap:10px}
.pair .key{height:56px;min-width:0;padding-left:16px;padding-right:16px;flex:1}
.pinned{flex:1}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.alb{position:relative;display:block}
.alb .cv{border-radius:4px 4px 0 0;width:100%}
.alb .plate{position:absolute;top:8px;left:8px}
.alb .strip{border-radius:0 0 4px 4px}

/* Lists, printed on a card */
.list{padding:0 16px}
.row{display:flex;align-items:center;gap:16px;height:78px;border-bottom:1px solid var(--strip-line)}
.row:last-child{border-bottom:0}
.row .cv{width:54px;border-radius:3px}
.row .nm b{font-size:20px;font-weight:600}
.row .nm span{font-size:15px;color:var(--ink-2)}
.state{display:flex;align-items:center;gap:8px;font:600 12.5px/1 Jost,sans-serif;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-2);white-space:nowrap}
.go{color:#9a906f}
.pager{display:flex;align-items:center;gap:10px;color:var(--chrome-2)}
.pager .num{font-size:22px;margin-right:4px}
.foot{display:flex;justify-content:space-between;align-items:center;height:46px;border-top:1px solid var(--strip-line);font-size:15px;color:var(--ink-2)}

/* A playlist */
.one .side{width:176px;flex:none}
.one .side .art{width:176px;box-shadow:none}
.one .side .key{height:56px}
.table{flex:1;min-width:0;overflow:hidden;align-self:flex-start}
.table .head{display:grid;grid-template-columns:62px 1fr auto;align-items:center;height:34px;padding:0 16px;background:var(--band);font:600 12px/1 Jost,sans-serif;text-transform:uppercase;letter-spacing:.09em}
.line{display:grid;grid-template-columns:14px 32px 1fr auto;gap:12px;align-items:center;height:70px;padding:0 16px;border-bottom:1px solid var(--strip-line)}
.line:last-child{border-bottom:0}
.line.on{background:var(--strip-2)}
.line .n{font-size:20px;color:var(--ink-2)}
.line .nm b{font-size:18.5px;font-weight:500}
.line.on .nm b{font-weight:600}
.line .nm span{font-size:14.5px;color:var(--ink-2)}
.line .d{font-size:15.5px;color:var(--ink-2)}

/* The queue */
.queue{justify-content:flex-start;gap:20px}
.queue .side{width:244px;flex:none;gap:14px}
.queue .side .art{width:244px}
.scrub.small{font-size:20px}
.scrub.small .num{width:38px}
.up{flex:1;min-width:0;display:flex;flex-direction:column}
.qrow{display:flex;align-items:center;gap:14px;height:78px;padding:0 6px;border-bottom:1px solid var(--cab-line)}
.qrow:last-child{border-bottom:0}
.qrow .nm b{font-size:19px;font-weight:500;color:var(--chrome)}
.qrow.on .nm b{color:var(--lamp);font-weight:600}
.qrow .nm span{font-size:15px;color:var(--chrome-2)}
.qrow .d{font-size:16px;color:var(--chrome-2)}

/* The system's own templates, approximated. */
.app.sys{background:#000;color:#fff;font-family:-apple-system,system-ui,sans-serif;font-weight:400}
.stabs{display:flex;align-items:center;gap:6px;height:74px;padding:0 20px;flex:none}
.stabs a{display:flex;flex-direction:column;align-items:center;gap:5px;width:104px;font-size:12px;font-weight:500;color:#8e8e93}
.stabs a.cur{color:#fff}
.stabs .now{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.12);justify-content:center;color:#fff}
.stabs .sp+.now{margin-left:auto}
.srows{padding:0 20px}
.srow{display:flex;align-items:center;gap:14px;height:84px;border-bottom:1px solid rgba(255,255,255,.12);color:#8e8e93}
.srow .cv{width:56px;border-radius:7px}
.srow .nm b{font-size:20px;font-weight:600;color:#fff}
.srow .nm span{font-size:15.5px;color:#8e8e93}
.snp .tint{background:rgba(0,0,0,.6)}
.shead{position:relative;display:flex;align-items:center;height:66px;padding:0 22px;flex:none}
.pill{height:38px;padding:0 16px;border-radius:19px;background:rgba(255,255,255,.16);display:grid;place-items:center;font-size:15px;font-weight:600}
.sbody{position:relative;flex:1;display:flex;align-items:center;gap:34px;padding:0 40px 30px}
.sbody .art{width:300px;border-radius:12px}
.sinfo{flex:1;min-width:0;display:flex;flex-direction:column}
.sinfo>b{font-size:30px;font-weight:700;letter-spacing:-.3px}
.sinfo>span{font-size:22px;color:rgba(255,255,255,.72);margin-top:2px}
.sinfo>.dim{font-size:18px;color:rgba(255,255,255,.5)}
.sline{height:6px;border-radius:3px;background:rgba(255,255,255,.24);margin-top:28px}
.sline i{display:block;width:41%;height:100%;border-radius:3px;background:#fff}
.stimes{display:flex;justify-content:space-between;font-size:14px;color:rgba(255,255,255,.6);margin-top:8px}
.sctl{display:flex;align-items:center;justify-content:space-between;margin-top:26px;padding:0 6px}

body{margin:0;background:#06090a;color:#e3ebe8;font:15px/1.45 Jost,system-ui,sans-serif;padding:32px;overflow-x:auto}
.sheet{display:grid;grid-template-columns:repeat(auto-fill,960px);gap:36px 32px}
figure{margin:0}
figcaption{margin-top:10px;max-width:960px;color:#93adab}
figcaption b{display:block;color:#e3ebe8;font:700 22px/1.1 "Big Shoulders Display",sans-serif;text-transform:uppercase;letter-spacing:.02em}
.car{border-radius:10px}
</style>
</head>
<body>
<div class="sheet">
<figure><div class="car" id="01-now-playing-strip">
<aside class="dock">
  <time>9:41</time>
  <div class="net"><span class="bars"><i></i><i></i><i></i><i></i></span>5G</div>
  <div class="apps">
    <span class="ic nav"><svg class="i" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg></span>
    <span class="ic tel"><svg class="i" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13.832 16.568a1 1 0 0 0 1.213-.303l.355-.465A2 2 0 0 1 17 15h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2A18 18 0 0 1 2 4a2 2 0 0 1 2-2h3a2 2 0 0 1 2 2v3a2 2 0 0 1-.8 1.6l-.468.351a1 1 0 0 0-.292 1.233 14 14 0 0 0 6.392 6.384"/></svg></span>
    <span class="ic crate"><i></i></span>
  </div>
  <span class="home"><svg class="i" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg></span>
</aside>
<div class="app pad np">
  <header class="bar">
    <span class="rnd glass night"><svg class="i" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></span>
    <h1>Now playing</h1>
    <span class="from">from <b>Late Drives</b></span>
    <span class="sp"></span>
    <span class="key quiet small"><svg class="i" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 5H3"/><path d="M11 12H3"/><path d="M11 19H3"/><path d="M21 16V5"/><circle cx="18" cy="16" r="3"/></svg>Queue</span>
  </header>
  <div class="mid">
    <span class="cv cv1 art" style="width:206px"></span>
    <div class="meta">
      <div class="strip xl"><b>Glass Motorway</b><span>Neon Orchard</span></div>
      <div class="facts"><span class="plate">07</span><span>Night Signals</span><span class="chip"><i class="lampd on"></i>Downloaded</span><span class="chip">FLAC</span></div>
      <div class="next"><span class="lbl">Next</span><b>Paper Kites at Dusk</b><span>Marlow Finch</span></div>
    </div>
